<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AK Strategy — Problems & Growth</title>
  <link rel="icon" href="assets/img/logo-mark-white.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <main>
    <section class="section page-top">
      <div class="section__head reveal">
        <div class="eyebrow" id="prEyebrow">Honest map</div>
        <h2 class="section__title" id="prTitle"></h2>
        <p class="section__sub" id="prSub"></p>
      </div>

      <div class="callout reveal">
        <div class="callout__ico" id="calloutIco"></div>
        <div><h3 id="calloutTitle"></h3><p id="calloutText"></p></div>
      </div>

      <div class="prob-grid" id="probGrid"></div>

      <div class="pg-bridge reveal">
        <span class="pg-bridge__from" id="bridgeFrom"></span>
        <span class="pg-bridge__arrow">↓</span>
        <span class="pg-bridge__to" id="bridgeTo"></span>
      </div>

      <div class="section__head reveal">
        <div class="eyebrow" id="grEyebrow">Growth</div>
        <h2 class="section__title" id="grTitle"></h2>
      </div>
      <div class="growth-grid" id="growthGrid"></div>
    </section>
  </main>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/problems.js"></script>
</body>
</html>
